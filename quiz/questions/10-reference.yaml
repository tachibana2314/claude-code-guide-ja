category: "リファレンス"
category_id: 10
source_file: "guide/ultimate-guide.md"

questions:
  - id: "10-001"
    difficulty: "junior"
    profiles: ["junior", "senior", "power"]
    question: "プランモードに入る（プラン/実行を切り替える）キーボードショートカットはどれですか？"
    options:
      a: "Ctrl+P"
      b: "Shift+Tab"
      c: "Alt+P"
      d: "Ctrl+Shift+P"
    correct: "b"
    explanation: |
      `Shift+Tab` はプランモードと実行モードを切り替えます。

      プランモードのナビゲーション：
      - `Shift+Tab` 1回：プラン/実行を切り替え
      - `Shift+Tab` 2回：深いプランモードに入る（OpusPlanでOpus使用）

      プランモードでは、変更を加える前に安全な読み取り専用の探索が可能です。
    doc_reference:
      file: "guide/ultimate-guide.md"
      section: "10.2 Keyboard Shortcuts"
      anchor: "#session-control"

  - id: "10-002"
    difficulty: "junior"
    profiles: ["junior", "senior", "power"]
    question: "前のチェックポイントに巻き戻す（Claudeの変更を元に戻す）キーボードショートカットはどれですか？"
    options:
      a: "Ctrl+Z"
      b: "Esc（ダブルタップ）"
      c: "Ctrl+R"
      d: "Alt+Z"
    correct: "b"
    explanation: |
      `Esc` をダブルタップ（Esc×2）すると前のチェックポイントに巻き戻します。

      これは `/rewind` コマンドと同等です。
      gitコミットを作成せずに現在のセッションでのClaudeの最近の変更を元に戻します。

      Claudeが間違いを犯して別のアプローチを試したいときに使用してください。
    doc_reference:
      file: "guide/ultimate-guide.md"
      section: "10.2 Keyboard Shortcuts"
      anchor: "#session-control"

  - id: "10-003"
    difficulty: "junior"
    profiles: ["junior", "senior", "power"]
    question: "`/compact` は何をしますか？"
    options:
      a: "ディスク上のファイルを圧縮する"
      b: "会話コンテキストを要約して圧縮する"
      c: "ターミナルウィンドウを最小化する"
      d: "Claudeの応答の長さを短縮する"
    correct: "b"
    explanation: |
      `/compact` は会話コンテキストを要約して圧縮します。

      `/compact` を使用する場面：
      - コンテキスト使用量が70〜90%に達したとき
      - 応答が遅くなってきたとき
      - Claudeが以前のコンテキストを忘れ始めたとき

      これにより重要な情報を保持しながらコンテキストスペースが解放されます。
      `/status` でコンテキスト使用量を確認してください。
    doc_reference:
      file: "guide/ultimate-guide.md"
      section: "10.1 Commands Table"
      anchor: "#built-in-commands"

  - id: "10-004"
    difficulty: "senior"
    profiles: ["senior", "power"]
    question: "ベストプラクティスによると、何%のコンテキストで /compact を実行すべきですか？"
    options:
      a: "50%"
      b: "70〜90%"
      c: "95%以上"
      d: "エラーが発生したときのみ"
    correct: "b"
    explanation: |
      コンテキスト管理ガイドライン：

      | コンテキストレベル | アクション |
      |----------------|---------|
      | 0〜50% | 自由に作業 |
      | 50〜75% | 選択的に使用 |
      | **75〜90%** | **`/compact` を使用** |
      | 90%以上 | `/clear` を使用 |

      70%での事前の圧縮はコンテキストの劣化を防ぎ、パフォーマンスを維持します。
    doc_reference:
      file: "guide/ultimate-guide.md"
      section: "10.4 Troubleshooting"
      anchor: "#context-recovery"

  - id: "10-005"
    difficulty: "junior"
    profiles: ["junior", "senior", "power"]
    question: "現在の操作をキャンセルするキーボードショートカットはどれですか？"
    options:
      a: "Esc"
      b: "Ctrl+C"
      c: "Ctrl+Z"
      d: "Alt+C"
    correct: "b"
    explanation: |
      `Ctrl+C` は現在の操作をキャンセルします。

      重要なショートカット：
      - `Ctrl+C`：操作をキャンセル
      - `Ctrl+D`：Claude Codeを終了
      - `Ctrl+R`：最後の操作を再試行
      - `Ctrl+L`：画面をクリア（コンテキストは保持）
      - `Esc`：現在の提案を閉じる
    doc_reference:
      file: "guide/ultimate-guide.md"
      section: "10.2 Keyboard Shortcuts"
      anchor: "#session-control"

  - id: "10-006"
    difficulty: "senior"
    profiles: ["senior", "power"]
    question: "すべてのgitコマンドを許可する正しい権限パターンはどれですか？"
    options:
      a: "Bash(git)"
      b: "Bash(git *)"
      c: "git:*"
      d: "Bash(*git*)"
    correct: "b"
    explanation: |
      パターン `Bash(git *)` は任意のgitコマンドを許可します。

      権限パターンの例：
      - `Bash(git *)` - 任意のgitコマンド
      - `Bash(npm test)` - 正確に「npm test」のみ
      - `Edit` - すべてのファイル編集
      - `mcp__serena__*` - すべてのSerenaツール

      ワイルドカード（*）により柔軟な権限マッチングが可能になります。
    doc_reference:
      file: "guide/ultimate-guide.md"
      section: "10.3 Configuration Reference"
      anchor: "#permission-patterns"

  - id: "10-007"
    difficulty: "junior"
    profiles: ["junior", "senior", "power"]
    question: "プロジェクト固有のCLAUDE.mdはどこに配置すべきですか（gitにコミット）？"
    options:
      a: "~/.claude/CLAUDE.md"
      b: "/project/.claude/CLAUDE.md"
      c: "/project/CLAUDE.md"
      d: "~/.config/claude/project.md"
    correct: "c"
    explanation: |
      CLAUDE.mdの場所：

      | 場所 | スコープ | コミット |
      |------|--------|--------|
      | `~/.claude/CLAUDE.md` | すべてのプロジェクト | 該当なし（グローバル） |
      | `/project/CLAUDE.md` | このプロジェクト | **はい** |
      | `/project/.claude/CLAUDE.md` | 個人 | いいえ |

      ルートの `CLAUDE.md` はコミットされてチームと共有されます。
      `.claude/CLAUDE.md` は個人的なもので `.gitignore` に入れるべきです。
    doc_reference:
      file: "guide/ultimate-guide.md"
      section: "10.3 Configuration Reference"
      anchor: "#claudemd-locations"

  - id: "10-008"
    difficulty: "senior"
    profiles: ["senior", "power"]
    question: "--mcp-debug フラグは何をしますか？"
    options:
      a: "MCPサーバーを無効にする"
      b: "詳細な出力でMCPサーバー接続をデバッグする"
      c: "MCP設定をテストする"
      d: "MCPの自動検出を有効にする"
    correct: "b"
    explanation: |
      `--mcp-debug` フラグはMCPサーバー接続のデバッグモードを有効にします。

      MCPデバッグテクニック：
      ```bash
      claude --mcp-debug  # すべてのMCP接続をデバッグ
      /mcp               # Claude Code内でMCPステータスを表示
      ```

      MCPサーバーが接続していない、またはツールが表示されない場合に使用してください。
    doc_reference:
      file: "guide/ultimate-guide.md"
      section: "10.4 Troubleshooting"
      anchor: "#mcp-debugging-techniques"

  - id: "10-009"
    difficulty: "power"
    profiles: ["power"]
    question: "MCPサーバー名の検証がパターンエラーで失敗した場合、許可される文字は何ですか？"
    options:
      a: "文字のみ"
      b: "文字、数字、アンダースコア、ハイフン（最大64文字）"
      c: "スペース以外の任意の文字"
      d: "英数字とピリオド"
    correct: "b"
    explanation: |
      MCPサーバー名は `^[a-zA-Z0-9_-]{1,64}` にマッチする必要があります。

      許可される：
      - 文字（a-z、A-Z）
      - 数字（0-9）
      - アンダースコア（_）
      - ハイフン（-）
      - 最大64文字

      許可されない：
      - スペース
      - 特殊文字（@、#など）
      - 64文字を超える
    doc_reference:
      file: "guide/ultimate-guide.md"
      section: "10.4 Troubleshooting"
      anchor: "#error-1-tool-name-validation-failed"

  - id: "10-010"
    difficulty: "junior"
    profiles: ["junior", "senior", "power"]
    question: "コンテキスト使用量とコストを含むセッション情報を表示するコマンドはどれですか？"
    options:
      a: "/info"
      b: "/status"
      c: "/stats"
      d: "/session"
    correct: "b"
    explanation: |
      `/status` コマンドはセッション情報を表示します。

      出力には以下が含まれます：
      - 使用中のモデル
      - コンテキスト使用率
      - セッションコスト
      - トークン数

      出力例：
      `Model: Sonnet | Ctx: 45.2k | Cost: $1.23 | Ctx(u): 42.0%`

      使用統計とアクティビティグラフには `/stats` を使用してください。
    doc_reference:
      file: "guide/ultimate-guide.md"
      section: "10.1 Commands Table"
      anchor: "#built-in-commands"

  - id: "10-011"
    difficulty: "senior"
    profiles: ["senior", "power"]
    question: "ヘッドレスモードで最大API支出を制限するフラグはどれですか？"
    options:
      a: "--cost-limit"
      b: "--max-budget-usd"
      c: "--spending-cap"
      d: "--budget"
    correct: "b"
    explanation: |
      `--max-budget-usd` フラグは最大API支出を設定します（`--print` と共にのみ）：

      ```bash
      claude -p "analyze" --max-budget-usd 5.00
      ```

      これにより自動化されたパイプラインでの暴走コストを防ぎます。
      予算を超えると操作が停止します。
    doc_reference:
      file: "guide/ultimate-guide.md"
      section: "10.3 Configuration Reference"
      anchor: "#cli-flags-reference"

  - id: "10-012"
    difficulty: "junior"
    profiles: ["junior", "senior", "power"]
    question: "Claude Codeプロンプトからシェルコマンドを直接実行するにはどうすればよいですか？"
    options:
      a: "shell: command"
      b: "!command"
      c: "$command"
      d: "run command"
    correct: "b"
    explanation: |
      `!command` プレフィックスはシェルコマンドを直接実行します。

      クイックアクション：
      - `!command` - シェルコマンドを実行
      - `@filename` - ファイルを参照
      - `Ctrl+C` - 操作をキャンセル
      - `Ctrl+R` - 最後の操作を再試行

      例：`!git status` はClaudeが解釈することなくgit statusを実行します。
    doc_reference:
      file: "guide/ultimate-guide.md"
      section: "10.1 Commands Table"
      anchor: "#quick-actions"

  - id: "10-013"
    difficulty: "senior"
    profiles: ["senior", "power"]
    question: "IDで特定のセッションを再開する正しい方法はどれですか？"
    options:
      a: "claude --session abc123"
      b: "claude -r abc123"
      c: "claude --load abc123"
      d: "claude -s abc123"
    correct: "b"
    explanation: |
      `-r` または `--resume` を使用して特定のセッションを再開します：

      ```bash
      claude -r abc123           # セッションabc123を再開
      claude --resume abc123     # 同上
      claude -c                  # 最後のセッションを再開（短い）
      claude --continue          # 最後のセッションを再開（長い）
      ```

      スクリプト用に `-p` と組み合わせます：`claude -r abc123 -p "ステータスを確認してください"`
    doc_reference:
      file: "guide/ultimate-guide.md"
      section: "10.3 Configuration Reference"
      anchor: "#cli-flags-reference"

  - id: "10-014"
    difficulty: "power"
    profiles: ["power"]
    question: "Claude Codeファイルに推奨される .gitignore パターンはどれですか？"
    options:
      a: ".claude/ の内容をすべて無視する"
      b: "settings.local.json と .claude/CLAUDE.md を無視し、agents/commands/hooks は保持する"
      c: "何も無視しない"
      d: "agents/ のみを無視する"
    correct: "b"
    explanation: |
      推奨される .gitignore：

      ```gitignore
      # Claude Code - 個人（無視する）
      .claude/settings.local.json
      .claude/CLAUDE.md
      .claude/.serena/

      # Claude Code - チーム（保持/コミットする）
      # .claude/agents/
      # .claude/commands/
      # .claude/hooks/
      # .claude/settings.json
      ```

      これにより、チームのワークフローを共有しながら個人設定をプライベートに保ちます。
    doc_reference:
      file: "guide/ultimate-guide.md"
      section: "9.11 Common Pitfalls & Best Practices"
      anchor: "#recommended-gitignore"

  - id: "10-015"
    difficulty: "junior"
    profiles: ["junior", "senior", "power"]
    question: "ガイドによると、毎日のワークフローの朝のセットアップはどれですか？"
    options:
      a: "コーディングをすぐに開始する"
      b: "git pull、/status、プロジェクトメモリを読み込む、昨日の進捗をレビューする"
      c: "最初にすべてのテストを実行する"
      d: "すべてのコンテキストをクリアする"
    correct: "b"
    explanation: |
      朝のセットアップワークフロー：

      1. 最新の変更を git pull する
      2. `/status` でコンテキストをレビューする
      3. プロジェクトメモリを読み込む（Serenaを使用している場合は `/sc:load`）
      4. 昨日の進捗をレビューする

      これにより、新鮮なコードと完全なコンテキスト認識で作業を開始できます。
    doc_reference:
      file: "guide/ultimate-guide.md"
      section: "10.6 Daily Workflow & Checklists"
      anchor: "#daily-workflow-pattern"

  - id: "10-016"
    difficulty: "senior"
    profiles: ["senior", "power"]
    question: "Claudeのツールが現在の作業ディレクトリ外のディレクトリにアクセスできるようにするフラグはどれですか？"
    options:
      a: "--include-dir"
      b: "--add-dir"
      c: "--context-dir"
      d: "--load-dir"
    correct: "b"
    explanation: |
      `--add-dir` を使用して追加のディレクトリへのツールアクセスを許可します：

      ```bash
      claude --add-dir ../shared ../utils
      claude --add-dir packages/api
      ```

      デフォルトでは、Claudeは現在の作業ディレクトリのファイルにのみアクセスできます。
      --add-dir を使用して他のディレクトリへの権限を拡張してください（例：モノレポ内の共有ライブラリ）。
    doc_reference:
      file: "guide/ultimate-guide.md"
      section: "10.3 Configuration Reference"
      anchor: "#cli-flags-reference"

  - id: "10-017"
    difficulty: "power"
    profiles: ["power"]
    question: "Sequential Thinking MCPが遅い、または応答しない場合、何を期待すべきですか？"
    options:
      a: "壊れているので再起動が必要"
      b: "大量の計算のため10〜30秒の応答は正常"
      c: "別のMCPに切り替える"
      d: "クエリの複雑さを減らす"
    correct: "b"
    explanation: |
      Sequential Thinkingは大量の計算を使用します―10〜30秒の応答を期待してください。

      これはエラーではありません、ただ待ってください。

      Sequential Thinkingのヒント：
      - 特定の、よく定義された問題に最も適している
      - 良い例：「モバイルでユーザー認証が失敗する理由をデバッグする」
      - 悪い例：「アプリを良くする」

      より長い応答時間はより深い分析を反映しています。
    doc_reference:
      file: "guide/ultimate-guide.md"
      section: "10.4 Troubleshooting"
      anchor: "#sequential-thinking-mcp-issues"

  - id: "10-018"
    difficulty: "junior"
    profiles: ["junior", "senior", "power"]
    question: "長いテキスト入力を作成するために外部エディターを開くショートカットはどれですか？"
    options:
      a: "Ctrl+E"
      b: "Ctrl+G"
      c: "Ctrl+O"
      d: "Ctrl+L"
    correct: "b"
    explanation: |
      `Ctrl+G` は長いテキストを作成するための外部エディターを開きます。

      便利な入力ショートカット：
      - `Ctrl+A`：行の先頭にジャンプ
      - `Ctrl+E`：行の末尾にジャンプ
      - `Ctrl+W`：前の単語を削除
      - `Ctrl+G`：外部エディターを開く
      - `Tab`：ファイルパスをオートコンプリート

      外部エディターにより、複雑なプロンプトを快適に編集できます。
    doc_reference:
      file: "guide/ultimate-guide.md"
      section: "10.2 Keyboard Shortcuts"
      anchor: "#input--navigation"

  - id: "10-019"
    difficulty: "junior"
    profiles: ["junior", "senior", "power"]
    question: "Claude Code v2.1.27の '--from-pr' フラグは何をしますか？"
    options:
      a: "新しいプルリクエストを作成する"
      b: "GitHub PRの番号またはURLにリンクされたセッションを再開する"
      c: "すべてのPRコメントをコンテキストに取り込む"
      d: "プルリクエストをクローズする"
    correct: "b"
    explanation: |
      `--from-pr` フラグ（v2.1.27）を使用すると、特定のGitHub PRにリンクされたClaude Codeセッションを再開できます。使用方法：`claude --from-pr 123` または `claude --from-pr https://github.com/org/repo/pull/123`。PRのコンテキスト（差分、コメント、チェック）がセッションに直接読み込まれます。
    doc_reference:
      file: "guide/claude-code-releases.md"
      section: "v2.1.27"
      anchor: "#v2127"

  - id: "10-020"
    difficulty: "senior"
    profiles: ["senior", "power"]
    question: "Claude Code v2.1.19でフック/コマンド引数に導入された破壊的変更は何ですか？"
    options:
      a: "引数が完全に削除された"
      b: "$ARGUMENTS.0（ドット構文）から $ARGUMENTS[0]（ブラケット構文）への移行"
      c: "新しい $PARAMS 変数が $ARGUMENTS を置き換えた"
      d: "引数はJSONフォーマットが必要になった"
    correct: "b"
    explanation: |
      Claude Code v2.1.19 は引数アクセス構文をドット表記（`$ARGUMENTS.0`）からブラケット表記（`$ARGUMENTS[0]`）に変更しました。この破壊的変更は引数を参照するすべてのカスタムコマンドとフックに影響します。新しいブラケット構文を使用するようにスクリプトを更新してください。
    doc_reference:
      file: "guide/ultimate-guide.md"
      section: "Breaking Changes"
      anchor: "#breaking-changes"

  - id: "10-021"
    difficulty: "junior"
    profiles: ["junior", "senior", "power", "pm"]
    question: "ガイドの「神話 vs 現実」セクションによると、「Claude Codeの隠し機能」についての真実は何ですか？"
    options:
      a: "パワーユーザー向けのシークレットフラグが存在する"
      b: "隠し機能はエンタープライズプランが必要"
      c: "隠し機能はない―Anthropicはシークレットフラグではなく段階的ロールアウトを使用している"
      d: "ベータフラグは .claude/config に保存されている"
    correct: "c"
    explanation: |
      「神話 vs 現実」セクションは「隠し機能」の神話を否定します。Anthropicはシークレットフラグや隠し設定ではなく段階的ロールアウト（機能をユーザーに徐々に有効化）を使用します。すべての機能はリリースノートに文書化されています。シークレットパワーユーザーモードは存在しません。
    doc_reference:
      file: "guide/ultimate-guide.md"
      section: "Myths vs Reality"
      anchor: "#myths-vs-reality"
